[build-system]
requires = ["uv_build>=0.12.5,<0.14"]
build-backend = "uv_build"

[project]
name = "dpm-xl"
version = "1.3.0"
description = "Parse and evaluate DPM-XL validation rules of the EBA Data Point Model (DPM 2.0) in Python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Luuk Hopman", email = "github@luukhopman.nl" }]
keywords = [
    "Data Point Model",
    "DPM",
    "DPM 2.0",
    "DPM-XL",
    "EBA",
    "XBRL",
    "xBRL-CSV",
    "XBRL-XML",
    "COREP",
    "FINREP",
    "regulatory reporting",
    "supervisory reporting",
    "EBA taxonomy",
    "filing rules",
    "validation rules",
    "report package",
    "dpm-toolkit",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Office/Business :: Financial",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://luukhopman.github.io/dpm-xl/"
Documentation = "https://luukhopman.github.io/dpm-xl/"
Source = "https://github.com/luukhopman/dpm-xl"
Issues = "https://github.com/luukhopman/dpm-xl/issues"
Changelog = "https://luukhopman.github.io/dpm-xl/project/changelog/"

[project.scripts]
dpm-xl = "dpmxl.cli:main"

[project.optional-dependencies]
columnar = [
    "polars>=2.0,<3",
]
xbrl = [
    "dpm-xbrl>=1.1,<2",
]

[dependency-groups]
test = ["pytest", "pytest-cov>=7.1,<8"]
lint = ["ruff", "ty"]
docs = [
    "zensical>=0.0.72,<0.1",
    "mkdocstrings-python>=2.0.10,<3",
    "polars>=2.0,<3",
    "dpm-xbrl>=1.0,<2",
    "dpm-synth>=1.0,<2",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "docs" },
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

# dpm-xbrl 1.1, which the xbrl extra needs, is not on PyPI yet; until it is,
# the lock takes the latest dpm-xbrl 1.x (see AGENTS.md).
[tool.uv]
override-dependencies = ["dpm-xbrl>=1.0,<2"]

# dpm-synth 1.0.0 is not on PyPI yet; the docs group takes it from GitHub
# until it is (see AGENTS.md).
[tool.uv.sources]
dpm-synth = { git = "https://github.com/luukhopman/dpm-synth", branch = "main" }

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
preview = true
select = [
    "B", "C4", "D", "DOC", "E", "ERA", "F", "I", "PIE", "PTH", "RET", "RSE",
    "RUF", "S", "SIM", "UP", "W",
]
ignore = [
    "incorrect-blank-line-before-class",
    "multi-line-summary-second-line",
    "docstring-extraneous-exception",
    "assert",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "S", "line-too-long"]
"examples/*" = ["DOC"]
"benchmarks/*" = ["DOC", "S", "ambiguous-unicode-character-string"]
"scripts/*" = ["S"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.src]
include = ["src", "tests"]

[tool.uv.build-backend]
module-name = "dpmxl"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib"]

[tool.coverage.run]
source = ["dpmxl"]
branch = true
