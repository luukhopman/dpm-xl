# Documentation site: `uv run python scripts/build_docs.py` builds it into
# site/ (strict) and adds llms.txt, llms-full.txt and a Markdown copy of
# every page; `uv run zensical serve` previews it.

[project]
site_name = "dpm-xl"
site_description = "Parser and evaluator for the EBA DPM-XL validation-rule language"
site_url = "https://luukhopman.github.io/dpm-xl/"
site_author = "Luuk Hopman"
repo_url = "https://github.com/luukhopman/dpm-xl"
repo_name = "luukhopman/dpm-xl"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2026 Luuk Hopman. Not affiliated with or endorsed by the European Banking Authority."
docs_dir = "docs"
site_dir = "site"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "How-to guides" = [
    "guides/index.md",
    { "Connect your data" = "guides/provider.md" },
    { "Evaluate a rule file" = "guides/rule-files.md" },
    { "Explain failures in a UI" = "guides/explain.md" },
    { "Evaluate large reports" = "guides/columnar.md" },
    { "Run rules in threads" = "guides/threads.md" },
    { "Compare with earlier reports" = "guides/time-shift.md" },
    { "Check rule syntax in CI" = "guides/ci.md" },
    { "Build editor support" = "guides/editor.md" },
    { "Analyse rules statically" = "guides/analyse.md" },
    { "From an XBRL report to explained failures" = "guides/end-to-end.md" },
  ] },
  { "Concepts" = [
    "concepts/index.md",
    { "Records and keys" = "concepts/records-and-keys.md" },
    { "Null logic" = "concepts/null.md" },
    { "Interval arithmetic" = "concepts/intervals.md" },
    { "Preconditions and results" = "concepts/results.md" },
    { "Statements and assignments" = "concepts/statements.md" },
    { "Sets" = "concepts/sets.md" },
    { "Aggregates and analytic functions" = "concepts/analytics.md" },
    { "Time" = "concepts/time.md" },
    { "Parameters, operations and table groups" = "concepts/references.md" },
  ] },
  { "Reference" = [
    "reference/index.md",
    { "Language" = "reference/language.md" },
    { "CLI" = "reference/cli.md" },
    { "Data formats" = "reference/data-formats.md" },
    { "Python API" = [
      "reference/api/index.md",
      { "dpmxl.evaluator" = "reference/api/evaluator.md" },
      { "dpmxl.explain" = "reference/api/explain.md" },
      { "dpmxl.provider" = "reference/api/provider.md" },
      { "dpmxl.columnar" = "reference/api/columnar.md" },
      { "dpmxl.parser" = "reference/api/parser.md" },
      { "dpmxl.ast" = "reference/api/ast.md" },
      { "dpmxl.grammar" = "reference/api/grammar.md" },
      { "dpmxl.values" = "reference/api/values.md" },
      { "dpmxl.recordset" = "reference/api/recordset.md" },
      { "dpmxl.references" = "reference/api/references.md" },
    ] },
  ] },
  { "AI agents" = "agents.md" },
  { "Project" = [
    { "Changelog" = "project/changelog.md" },
    { "Stability and versioning" = "project/stability.md" },
    { "Benchmarks" = "project/benchmarks.md" },
    { "Security" = "project/security.md" },
    { "Contributing" = "project/contributing.md" },
    { "Licence" = "project/licence.md" },
  ] },
]

[project.theme]
language = "en"
logo = "assets/logo-header.svg"
favicon = "assets/favicon.svg"
features = [
  "content.action.edit",
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/luukhopman/dpm-xl"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/dpm-xl/"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true

[project.plugins.search]

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
docstring_section_style = "list"
filters = "public"
heading_level = 2
members_order = "source"
merge_init_into_class = true
separate_signature = true
show_if_no_docstring = true
show_root_heading = true
show_root_full_path = true
show_signature_annotations = true
show_source = false
show_symbol_type_heading = true
show_symbol_type_toc = true
signature_crossrefs = true
